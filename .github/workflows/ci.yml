name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.cursor/**'
      - '.audit/**'
      - 'roms/**'
      - '.gitignore'
      - 'eng/run-emulator.ps1'
      - 'eng/run-emulator.sh'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.cursor/**'
      - '.audit/**'
      - 'roms/**'
      - '.gitignore'
      - 'eng/run-emulator.ps1'
      - 'eng/run-emulator.sh'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: build/tools
          key: tools-${{ runner.os }}-${{ hashFiles('eng/install-sjasmplus.ps1') }}

      - name: Install sjasmplus
        shell: pwsh
        run: ./eng/install-sjasmplus.ps1

      - name: Test
        run: dotnet test --solution cp500-os.slnx
